<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOLID PROJECTS — تصنيع مشاريع الأوفرود</title>
<meta name="description" content="تصنيع وتجهيز قطع الأوفرود في الكويت: دعاميات، أرفف سطح، منصات، درجات جانبية وحمّالات — تصميم وتصنيع وتركيب داخل الورشة.">
<meta name="theme-color" content="#070809">
<meta http-equiv="Cache-Control" content="no-cache">

<body>
<div class="grain" aria-hidden="true"></div>

<!-- ============ خلفية الموقع: فيديو شغّال طول الوقت ============ -->
<div class="bgv" aria-hidden="true">
  <video id="bgVideo" playsinline muted loop autoplay preload="auto"></video>
  <div class="bgv__ph" id="bgPh"></div>
  <div class="bgv__scrim"></div>
</div>

<!-- ============ NAV ============ -->
<header class="nav" id="nav">
  <a class="nav__logo" href="#top">
    <span class="mark" id="logoMark"><i></i></span>
    <span class="wordmark"><b id="brandA">SOLID</b><em id="brandB">PROJECTS</em></span>
  </a>
  <nav class="nav__links">
    <a href="#works">أعمالنا</a>
    <a href="#services">خدماتنا</a>
    <a href="#process">طريقة الشغل</a>
  </nav>
  <a class="btn btn--sm" id="navCta" href="#contact"><span>تواصل معنا</span><i class="ar"></i></a>
  <button class="nav__burger" id="burger" aria-label="القائمة"><i></i><i></i></button>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero__media">
    <div class="hero__hint" id="heroHint">ضع فيديو الريل باسم <code>hero.mp4</code> داخل مجلد <code>media</code></div>
    <div class="hero__scrim"></div>
  </div>

  <div class="hero__rail" aria-hidden="true"><span id="railText"></span></div>

  <div class="hero__body">
    <p class="kicker" id="heroKicker"></p>
    <h1 class="hero__title" id="heroTitle"></h1>
    <p class="hero__lead" id="heroLead"></p>
    <div class="hero__cta">
      <a class="btn btn--solid" id="heroCta1" href="#contact"><span></span><i class="ar"></i></a>
      <a class="btn" id="heroCta2" href="#works"><span></span><i class="ar"></i></a>
    </div>
  </div>

  <div class="hero__foot">
    <a class="scrollcue" href="#studio"><i></i><span>مرّر</span></a>
    <span class="hero__loc" id="heroLoc"></span>
  </div>
</section>

<!-- ============ TICKER ============ -->
<div class="ticker" aria-hidden="true"><div class="ticker__row" id="tickerRow"></div></div>

<!-- ============ WORKS ============ -->
<section class="works" id="works">
  <div class="works__banner">
    <img src="media/gallery/workshop-sign.jpg" alt="ورشة SOLID PROJECTS — لافتة المدخل" loading="lazy">
    <div class="sec__head">
      <span class="sec__idx">٠٢</span>
      <h2 class="sec__title">أعمالنا<em>من الورشة</em></h2>
      <p class="sec__sub">كل قطعة تشوفها انصنعت عندنا من الصفر.</p>
    </div>
  </div>
  <div class="works__grid" id="worksGrid"></div>
</section>

<!-- ============ SERVICES ============ -->
<section class="services" id="services">
  <div class="sec__head">
    <span class="sec__idx">٠٣</span>
    <h2 class="sec__title">خدماتنا</h2>
  </div>
  <div class="services__grid" id="servicesGrid"></div>
</section>

<!-- ============ PROCESS ============ -->
<section class="process" id="process">
  <div class="sec__head">
    <span class="sec__idx">٠٤</span>
    <h2 class="sec__title">طريقة الشغل</h2>
  </div>
  <ol class="process__list" id="processList"></ol>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="contact__in">
    <p class="kicker">جاهز تبدأ؟</p>
    <h2 class="contact__title">عندك فكرة لسيارتك؟<em>احنا نصنعها.</em></h2>
    <div class="contact__acts">
      <a class="btn btn--solid btn--lg" id="waBtn" target="_blank" rel="noopener"><span>واتساب</span><i class="ar"></i></a>
      <a class="btn btn--lg" id="igBtn" target="_blank" rel="noopener"><span>إنستغرام</span><i class="ar"></i></a>
    </div>
    <div class="contact__meta">
      <span id="cPhone" dir="ltr"></span><i></i><span id="cLoc"></span>
    </div>
  </div>
</section>

<footer class="foot">
  <span id="footBrand"></span>
  <span class="foot__sep"></span>
  <span id="footYear"></span>
</footer>
